[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "public-feedback-ai"
version = "0.1.0"
description = "Vietnamese public service feedback research"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = ["pydantic-settings>=2,<3"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
data = ["pandas", "numpy", "pyarrow"]
ml = ["scikit-learn", "torch", "transformers", "datasets", "mlflow"]
phobert = ["torch>=2.6,<3", "transformers>=4.46,<6", "safetensors>=0.4,<1", "scikit-learn"]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "sqlalchemy>=2,<3", "alembic>=1.13,<2", "psycopg[binary]>=3,<4"]
dashboard = ["streamlit>=1.40,<2", "plotly>=5.24,<7", "httpx>=0.27,<1"]

[project.scripts]
pfa = "pfa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
